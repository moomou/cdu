[package]
name = "cdu"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
description = "An ncdu-style disk usage browser with a persistent, incremental Linux index"
repository = "https://github.com/moomou/cdu"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bincode = "1.3.3"
blake3 = "1.8.7"
clap = { version = "4.6.9", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
libc = "0.2.191"
memmap2 = "0.9.12"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled", "hooks"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[dev-dependencies]
tempfile = "3.27.0"

[[bench]]
name = "incremental"
harness = false

[[bench]]
name = "frontend"
harness = false
